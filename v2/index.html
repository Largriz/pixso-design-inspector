<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Inspector — проверка макета</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --bg2: #1a1a1a;
    --bg3: #242424;
    --border: #2e2e2e;
    --text: #e8e8e8;
    --text2: #888;
    --accent: #7C6CF2;
    --accent-hover: #9588f5;
    --success: #4caf7d;
    --error: #e05c5c;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'SF Mono', 'Fira Code', Consolas, monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 32px 16px 48px;
  }

  .wrap {
    max-width: 800px;
    margin: 0 auto;
  }

  .header {
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .header p {
    color: var(--text2);
    font-size: 13px;
    margin-top: 6px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
  }

  .card-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .json-input {
    width: 100%;
    min-height: 280px;
    padding: 14px 16px;
    background: var(--bg3);
    border: none;
    color: #9cdcfe;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
  }
  .json-input::placeholder { color: #555; }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 18px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font);
    transition: background .15s, opacity .15s;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) { background: #2d2d2d; }

  .status {
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text2);
    border-top: 1px solid var(--border);
    display: none;
  }
  .status.visible { display: block; }
  .status.loading { color: var(--accent); }
  .status.success { color: var(--success); }
  .status.error { color: var(--error); }

  .result-body {
    padding: 16px 20px;
    font-size: 14px;
    line-height: 1.7;
    color: #c8e6c9;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 500px;
    overflow-y: auto;
  }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text2);
  }
  .meta-row strong { color: var(--text); font-weight: 500; }

  .hint {
    font-size: 12px;
    color: var(--text2);
    margin-top: 8px;
  }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>Design Inspector</h1>
    <p>Вставьте JSON из плагина Pixso и запустите проверку через GigaChat</p>
  </div>

  <div class="card">
    <div class="card-head">
      <span>JSON макета</span>
      <button class="btn btn-secondary" id="btnPaste" type="button" style="padding:6px 12px;font-size:12px">
        Вставить из буфера
      </button>
    </div>
    <textarea
      class="json-input"
      id="jsonInput"
      placeholder='Вставьте сюда JSON (Ctrl+V). После экспорта из плагина он уже в буфере обмена.'
      spellcheck="false"
    ></textarea>
    <div class="actions">
      <button class="btn btn-primary" id="btnCheck" type="button">
        Проверить
      </button>
      <button class="btn btn-secondary" id="btnClear" type="button">
        Очистить
      </button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="card-head">Ответ GigaChat</div>
    <div class="result-body" id="resultBody"></div>
    <div class="meta-row" id="resultMeta"></div>
  </div>

  <p class="hint">
    Плагин Pixso (папка <code>plugin-web</code>) копирует JSON в буфер и открывает эту страницу.
    Анализ выполняется на сервере; ключи GigaChat не передаются в браузер.
  </p>
</div>

<script>
const jsonInput = document.getElementById('jsonInput');
const btnCheck = document.getElementById('btnCheck');
const btnPaste = document.getElementById('btnPaste');
const btnClear = document.getElementById('btnClear');
const statusEl = document.getElementById('status');
const resultCard = document.getElementById('resultCard');
const resultBody = document.getElementById('resultBody');
const resultMeta = document.getElementById('resultMeta');

let isBusy = false;

function setStatus(text, type) {
  statusEl.textContent = text;
  statusEl.className = 'status visible ' + (type || '');
}

function clearStatus() {
  statusEl.className = 'status';
  statusEl.textContent = '';
}

function setBusy(busy) {
  isBusy = busy;
  btnCheck.disabled = busy;
  btnPaste.disabled = busy;
}

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function pasteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    if (text) {
      jsonInput.value = text;
      setStatus('Вставлено из буфера (' + text.length.toLocaleString('ru-RU') + ' симв.)', 'success');
    } else {
      setStatus('Буфер обмена пуст', 'error');
    }
  } catch (err) {
    setStatus('Не удалось прочитать буфер: ' + err.message, 'error');
  }
}

async function runCheck() {
  if (isBusy) return;

  const raw = jsonInput.value.trim();
  if (!raw) {
    setStatus('Вставьте JSON в поле выше', 'error');
    return;
  }

  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    setStatus('Некорректный JSON: ' + e.message, 'error');
    return;
  }

  setBusy(true);
  resultCard.style.display = 'none';
  setStatus('Отправляю на анализ GigaChat...', 'loading');
  statusEl.innerHTML = '<span class="spinner"></span>Отправляю на анализ GigaChat...';

  try {
    const response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(parsed),
    });

    if (!response.ok) {
      const errText = await response.text();
      let detail = errText.slice(0, 300);
      try {
        const errJson = JSON.parse(errText);
        detail = errJson.details || errJson.error || detail;
      } catch (_) {}
      throw new Error('Сервер вернул ' + response.status + ': ' + detail);
    }

    const data = await response.json();

    resultBody.textContent = data.agentResponse || '(пустой ответ)';
    resultMeta.innerHTML =
      '<span>Символов: <strong>' + (data.charCount || raw.length).toLocaleString('ru-RU') + '</strong></span>' +
      (parsed._meta?.pageName
        ? '<span>Страница: <strong>' + escapeHtml(parsed._meta.pageName) + '</strong></span>'
        : '') +
      (data.id ? '<span>ID: <strong>' + escapeHtml(data.id) + '</strong></span>' : '');

    resultCard.style.display = 'block';
    setStatus('Анализ завершён', 'success');
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (err) {
    setStatus('Ошибка: ' + err.message, 'error');
  } finally {
    setBusy(false);
  }
}

btnCheck.addEventListener('click', runCheck);
btnPaste.addEventListener('click', pasteFromClipboard);
btnClear.addEventListener('click', function() {
  jsonInput.value = '';
  resultCard.style.display = 'none';
  clearStatus();
});

jsonInput.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCheck();
  }
});

// При открытии со страницы плагина — попытка автовставки из буфера
pasteFromClipboard().catch(function() {});
</script>
</body>
</html>
