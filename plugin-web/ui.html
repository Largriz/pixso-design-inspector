<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Inspector Web</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1e1e1e;
    --bg2: #2a2a2a;
    --border: #444;
    --text: #e8e8e8;
    --text2: #aaa;
    --accent: #7C6CF2;
    --accent-hover: #9588f5;
    --success: #4caf7d;
    --error: #e05c5c;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header h1 { font-size: 15px; font-weight: 600; }
  .header p { color: var(--text2); font-size: 11.5px; margin-top: 3px; }

  .content {
    flex: 1;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 40px;
    font-size: 12px;
    color: var(--text2);
    transition: border-color .2s, background .2s;
  }
  .status-bar.success { border-color: var(--success); background: rgba(76,175,125,.08); color: var(--success); }
  .status-bar.error   { border-color: var(--error);   background: rgba(224,92,92,.08);  color: var(--error); }
  .status-bar.loading { border-color: var(--accent);  background: rgba(124,108,242,.08); color: var(--accent); }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .status-dot.spin {
    background: transparent;
    border: 2px solid currentColor;
    border-top-color: transparent;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 11px 16px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background .15s, opacity .15s, transform .1s;
    font-family: var(--font);
    background: var(--accent);
    color: #fff;
  }
  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .icon { width: 15px; height: 15px; flex-shrink: 0; }

  .footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .footer-note { font-size: 10.5px; color: var(--text2); }
  .close-btn {
    background: none; border: none; color: var(--text2);
    cursor: pointer; font-size: 11.5px; padding: 4px 8px;
    border-radius: 4px; font-family: var(--font);
  }
  .close-btn:hover { background: var(--bg2); color: var(--text); }
</style>
</head>
<body>

<div class="header">
  <h1>Design Inspector Web</h1>
  <p>JSON в буфер → открыть веб-проверку</p>
</div>

<div class="content">
  <div class="status-bar" id="statusBar">
    <span class="status-dot"></span>
    <span id="statusText">Готов. Нажмите «Проверить».</span>
  </div>

  <button class="btn" id="btnInspect" onclick="startInspect()">
    <svg class="icon" viewBox="0 0 16 16" fill="none">
      <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span id="btnInspectLabel">Проверить</span>
  </button>
</div>

<div class="footer">
  <span class="footer-note">web-flow · v3.0.0</span>
  <button class="close-btn" onclick="closePlugin()">Закрыть</button>
</div>

<script>
const WEB_URL = 'https://pixso-design-inspector.vercel.app';

let currentJson = null;
let isBusy = false;
let hasRunOnce = false;

function formatNumber(n) {
  return n.toLocaleString('ru-RU');
}

function setStatus(text, type) {
  const bar = document.getElementById('statusBar');
  const dot = bar.querySelector('.status-dot');
  const label = document.getElementById('statusText');
  bar.className = 'status-bar ' + (type || '');
  dot.className = 'status-dot ' + (type === 'loading' ? 'spin' : '');
  label.textContent = text;
}

function setBusy(busy) {
  isBusy = busy;
  document.getElementById('btnInspect').disabled = busy;
}

function updateInspectButtonLabel() {
  document.getElementById('btnInspectLabel').textContent =
    hasRunOnce ? 'Проверить снова' : 'Проверить';
}

function startInspect() {
  if (isBusy) return;
  setBusy(true);
  setStatus('Собираю JSON...', 'loading');
  currentJson = null;
  parent.postMessage({ pluginMessage: { type: 'START_INSPECT' } }, '*');
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch (e) {
      document.body.removeChild(ta);
      throw e;
    }
  }
}

function openWebChecker() {
  window.open(WEB_URL, '_blank');
}

async function onJsonReady(json, nodeCount, source) {
  currentJson = json;

  setStatus('Копирую JSON в буфер...', 'loading');

  try {
    await copyToClipboard(json);
    setStatus(
      'JSON скопирован (' + formatNumber(json.length) + ' симв.). Открываю веб-проверку...',
      'loading'
    );
    openWebChecker();
    hasRunOnce = true;
    updateInspectButtonLabel();
    setStatus(
      'Готово: ' + nodeCount + ' нод из ' +
      (source === 'selection' ? 'выделения' : 'страницы') +
      '. JSON в буфере — вставьте на сайте и нажмите «Проверить».',
      'success'
    );
  } catch (err) {
    setStatus('Ошибка копирования: ' + err.message, 'error');
  } finally {
    setBusy(false);
  }
}

function closePlugin() {
  parent.postMessage({ pluginMessage: { type: 'CLOSE' } }, '*');
}

window.onmessage = function(event) {
  const msg = event.data.pluginMessage;
  if (!msg) return;

  switch (msg.type) {
    case 'STATUS':
      setStatus(msg.text, 'loading');
      break;

    case 'JSON_READY':
      onJsonReady(msg.json, msg.nodeCount, msg.source);
      break;

    case 'ERROR':
      setStatus('Ошибка: ' + msg.text, 'error');
      setBusy(false);
      break;
  }
};
</script>
</body>
</html>
